<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The SAD Archive | Master Dossier</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #161616;
            background-image: url("https://www.transparenttextures.com/patterns/stucco.png");
            font-family: 'Special Elite', monospace;
            color: #111;
        }
        .craft-cover {
            background-color: #b59f84;
            background-image: url("https://www.transparenttextures.com/patterns/cardboard-flat.png");
            box-shadow: 10px 10px 30px rgba(0,0,0,0.8);
        }
        .masking-tape {
            background-color: #dcd3b6;
            background-image: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
            height: 40px;
            width: 160px;
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            z-index: 10;
        }
        .blink-tap {
            animation: blink 1.2s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.98); }
        }
        .handwritten {
            font-family: 'Caveat', cursive;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <!-- Master Cover Card (Photo #1: An Archivist's Tale) -->
    <div class="craft-cover w-full max-w-xl p-10 relative transform rotate-1 border border-stone-800 text-center group">
        <div class="masking-tape"></div>
        
        <div class="text-xs font-bold uppercase tracking-widest border-b-2 border-stone-900 pb-3 mb-6">
            NFSU COVERT OPERATIONS // EYES ONLY
        </div>

        <span class="handwritten text-red-700 text-3xl block -rotate-2 mb-2">Primary Intelligence Gateway</span>
        
        <h1 class="font-black text-5xl uppercase tracking-tighter leading-none py-6 border-y-4 border-stone-900 my-4">
            AN ARCHIVIST'S <span class="bg-black text-stone-100 px-2">TALE</span>
        </h1>

        <p class="text-xs uppercase tracking-widest text-stone-800 font-bold mb-8">
            The Life, Field Research & Chaos of Prof. Dr. SAD
        </p>

        <!-- Interactive Gateway Button with Blinking Tap Indicator -->
        <a href="archive.html" class="inline-block bg-stone-900 text-stone-100 px-8 py-4 font-bold uppercase tracking-widest text-sm border-2 border-stone-700 shadow-xl hover:bg-red-950 transition-all relative">
            <span class="blink-tap absolute -top-4 right-2 bg-red-700 text-white text-[10px] px-2 py-0.5 rounded uppercase tracking-wider font-bold">
                [TAP TO INSPECT]
            </span>
            [ ENTER THE DOSSIER ]
        </a>

        <div class="mt-8 pt-4 border-t border-stone-800 text-[10px] uppercase tracking-widest text-stone-700">
            Curated by Ame // Teachers' Day Special Edition
        </div>
    </div>

</body>
</html>
